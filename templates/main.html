<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Search Results | MyStore</title>
  <style>
    body { font-family: 'Poppins', sans-serif; background: #f8f9fa; margin: 0; }
    .container { width: 95%; max-width: 1200px; margin: 30px auto; }
    .top { display:flex; justify-content:space-between; align-items:center; margin-bottom:20px; }
    .grid { display:grid; grid-template-columns: repeat(auto-fill,minmax(220px,1fr)); gap:18px; }
    .card { background:white; padding:12px; border-radius:10px; box-shadow:0 2px 8px rgba(0,0,0,0.08); text-align:center; }
    .card img { width:100%; height:160px; object-fit:cover; border-radius:8px; }
    .card h4 { margin:10px 0 6px; font-size:15px; }
    .card p { margin:0; color:#007bff; font-weight:bold; }
    .search-again { display:flex; gap:8px; align-items:center; }
    .search-again input { padding:8px 10px; border-radius:8px; border:1px solid #ccc; width:240px; }
    .search-again button { padding:8px 12px; border-radius:8px; border:none; background:#007bff; color:white; cursor:pointer; }
    a { color: inherit; text-decoration: none; }
  </style>
</head>
<body>
  <div class="container">
    <div class="top">
      <div>
        <h2>Products</h2>
        <p style="color:#555">{{ message }}</p>
      </div>

      <div class="search-again">
        <input id="searchAgainInput" type="text" placeholder="Search again..."/>
        <button onclick="searchAgain()">Search</button>
      </div>
    </div>

    <div class="grid">
      {% for p in products %}
      <a href="/product/{{ p['Name'] | urlencode }}">
        <div class="card">
          <img src="{{ p['ImageURL'] }}" alt="{{ p['Name'] }}"/>
          <h4>{{ truncate(p['Name'], 40) }}</h4>
          <p>₹{{ p.get('Price', random_price) }}</p>
        </div>
      </a>
      {% else %}
        <p>No products found.</p>
      {% endfor %}
    </div>
  </div>

  <script>
    function searchAgain(){
      const q = document.getElementById('searchAgainInput').value.trim();
      if(q) window.location.href = "/main?query=" + encodeURIComponent(q);
      else alert("Type a search term");
    }
  </script>
</body>
</html>
